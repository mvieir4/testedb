<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Carros</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <p class="tag">GRUPO 2 · JAVASCRIPT</p>
      <h1>Cadastro de carros</h1>
      <p class="subtitulo">Gerencie os veículos cadastrados no sistema.</p>
    </header>

    <section class="painel">
      <h2 id="titulo-formulario">Cadastrar carro</h2>
      <form id="form-carro">
        <input type="hidden" id="carro-id">

        <div class="campos">
          <label>Placa<input id="placa" maxlength="10" required placeholder="ABC1D23"></label>
          <label>Número do chassi<input id="chassi" maxlength="30" required></label>
          <label>Marca<input id="marca" required></label>
          <label>Modelo<input id="modelo" required></label>
          <label>Ano<input id="ano" type="number" min="1886" max="2100" required></label>
          <label>Cor<input id="cor" required></label>
          <label>Combustível
            <select id="combustivel" required>
              <option value="">Selecione</option>
              <option>Gasolina</option><option>Etanol</option><option>Flex</option>
              <option>Diesel</option><option>Elétrico</option><option>Híbrido</option>
              <option>GNV</option>
            </select>
          </label>
          <label>Capacidade<input id="capacidade" required placeholder="5 pessoas / 50 litros"></label>
          <label>Motor<input id="motor" required placeholder="1.0, 2.0..."></label>
          <label>Velocidade máxima (km/h)<input id="velocidade" type="number" min="0" required></label>
        </div>

        <div class="acoes">
          <button type="submit" id="botao-salvar">Cadastrar carro</button>
          <button type="button" id="botao-cancelar" class="secundario" hidden>Cancelar edição</button>
        </div>
      </form>
      <p id="mensagem" role="status"></p>
    </section>

    <section class="painel">
      <div class="topo-lista">
        <h2>Carros cadastrados</h2>
        <button type="button" class="secundario" id="botao-atualizar">Atualizar lista</button>
      </div>
      <div class="tabela-container">
        <table>
          <thead>
            <tr><th>Placa</th><th>Marca / Modelo</th><th>Ano</th><th>Cor</th><th>Combustível</th><th>Ações</th></tr>
          </thead>
          <tbody id="lista-carros">
            <tr><td colspan="6">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
